version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: clipper
      POSTGRES_USER: clipper
      POSTGRES_PASSWORD: clipper
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  db-data:
  minio-data:
  redis-data:
